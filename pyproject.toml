[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "agentic-ai-orchestration-reference"
version = "0.1.0"
description = "Local-only governed agentic AI orchestration reference"
requires-python = ">=3.12,<3.13"
dependencies = [
  "langgraph>=1.2.20,<1.3",
  "langgraph-checkpoint-sqlite>=3.0,<4",
  "pydantic>=2.11,<3",
]

[project.scripts]
agentic-orchestration = "agentic_orchestration.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_orchestration"]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
